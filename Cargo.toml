[workspace]
resolver = "2"
members = [
    "crates/audio-cpal",
    "crates/core-common",
    "crates/core-gb",
    "crates/frontend-cli",
    "crates/frontend-swr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Core dependencies shared across crates
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
tracing = "0.1"

# Frontend / Rendering / Audio
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.37"
cpal = "0.18.2"
ringbuf = "0.5.3"
gilrs = "0.11.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
